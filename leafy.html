<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leafy's Space</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='24' height='24' rx='6' fill='%23000' stroke='none'/%3E%3Cpath d='M6 18C6 10 11 6 18 6c0 7-4 12-12 12zM6 18l7-7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@400;600&family=Fira+Code:wght@400;600&family=Lora:wght@400;600&family=Nunito:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--accent:#243b9e;--bg:#000;--dfg:#fff;--glass:rgba(0,0,0,.45);--font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--cc:#fff;--cs:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;width:100%;background:var(--bg);color:var(--dfg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
svg{display:block}
#bgimg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0}
#rain{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}

/* buttons / inputs (apps are black & white) */
.btn{background:#fff;color:#000;border-radius:8px;padding:8px 14px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#141414;color:#fff;border:1px solid #333}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:#1a0000;color:#ff5c5c;border:1px solid #5a1010}
.inp{background:#111;border:1px solid #2c2c2c;border-radius:8px;padding:9px 11px;width:100%;outline:none;color:#fff}
.inp:focus{border-color:#fff}
textarea.inp{resize:none}
select.inp{appearance:none}
.muted{color:#888}
h2{font-size:16px;font-weight:600}

/* login */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.lcard{width:min(380px,100%);background:rgba(0,0,0,.72);backdrop-filter:blur(18px);border:1px solid #222;border-radius:18px;padding:26px;color:#fff}
.lcard h1{font-size:26px;font-weight:600;text-align:center;letter-spacing:-.5px}
.lcard .tag1{text-align:center;color:#8a8a8a;font-size:12px;margin:6px 0 18px}
.tabs{display:flex;background:#111;border-radius:10px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;padding:7px;border-radius:8px;color:#888;font-weight:600}
.tabs button.on{background:#fff;color:#000}
.lcard label{display:block;font-size:12px;color:#999;margin:10px 0 4px}
.lcard .btn{width:100%;margin-top:14px;padding:10px}
.err{color:#ff6b6b;font-size:12px;min-height:16px;margin-top:8px;text-align:center}
.warn{background:#1b1400;border:1px solid #4a3a00;color:#ffd166;font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:12px}
.hint{font-size:11px;color:#666;margin-top:4px}

/* desktop */
#desktop{position:fixed;inset:0;z-index:2;pointer-events:none}
#hero{position:absolute;inset:30px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px 60px;color:var(--dfg)}
#hero h1{font-size:clamp(34px,7vw,72px);font-weight:600;letter-spacing:-2px}
#hero p{opacity:.55;margin-top:8px;font-size:clamp(12px,2vw,15px)}
#menubar{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--glass);backdrop-filter:blur(20px);color:var(--dfg);pointer-events:auto;font-size:13px;z-index:400}
#menubar .l,#menubar .r{display:flex;align-items:center;gap:12px}
#menubar b{font-weight:600;display:flex;align-items:center;gap:6px}
#menubar svg{width:15px;height:15px}
#appname{opacity:.7}
.mbtn{padding:3px 9px;border-radius:6px;font-weight:500}
.mbtn:hover{background:rgba(128,128,128,.25)}
#panic{background:#e11d1d;color:#fff;font-weight:700;border-radius:6px;padding:3px 10px;font-size:12px;letter-spacing:.4px;box-shadow:0 0 12px #e11d1d66}
#panic:hover{background:#ff2b2b}
#windows{position:absolute;inset:30px 0 92px 0;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;background:#0a0a0a;color:#fff;border:1px solid #2a2a2a;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden;resize:both;min-width:300px;min-height:200px;pointer-events:auto;font-family:var(--font)}
.win.maxed{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;resize:none}
.win.mini{display:none}
.tb{height:36px;flex:none;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 12px;position:relative;touch-action:none;user-select:none}
.tl{display:flex;gap:8px;z-index:2}
.tl button{width:13px;height:13px;border-radius:50%;position:relative}
.tl .close{background:#ff5f57}.tl .min{background:#febc2e}.tl .max{background:#28c840}
.tl button::after{content:"";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#0008;line-height:13px;text-align:center}
.tl:hover .close::after{content:"×"}.tl:hover .min::after{content:"–"}.tl:hover .max::after{content:"+"}
.ttl{position:absolute;left:0;right:0;text-align:center;font-size:12px;color:#aaa;pointer-events:none}
.wbody{flex:1;min-height:0;position:relative;container-type:inline-size;overflow:hidden}

#bottom{position:absolute;left:0;right:0;bottom:0;padding:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#bl{display:flex;align-items:center;gap:8px;pointer-events:auto;flex:1}
#bspace{flex:1}
#aiOrb{width:44px;height:44px;border-radius:50%;background:#000;border:1px solid #333;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px var(--accent);transition:.2s}
#aiOrb:hover{transform:scale(1.08)}
#aiOrb svg{width:22px;height:22px}
#status{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px;background:var(--glass);backdrop-filter:blur(20px);color:var(--dfg);font-size:12px;white-space:nowrap}
#status .sep{width:1px;height:14px;background:currentColor;opacity:.25}
#dock{display:flex;gap:8px;padding:8px;border-radius:20px;background:var(--glass);backdrop-filter:blur(20px);pointer-events:auto;max-width:100%;overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.dk{width:44px;height:44px;flex:none;border-radius:12px;background:#0b0b0b;border:1px solid #2a2a2a;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;transition:.15s}
.dk:hover{transform:translateY(-4px) scale(1.08)}
.dk svg{width:21px;height:21px}
.dk.open::after{content:"";position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--dfg)}
.dk.min{opacity:.6}
@media(max-width:820px){
 #bottom{flex-direction:column-reverse;align-items:stretch;gap:8px}
 #bspace{display:none}
 #dock{align-self:center}
 #windows{inset:30px 0 112px 0}
 #status{flex:1;justify-content:center;min-width:0;font-size:11px;gap:6px;padding:0 8px}
}
@media(min-width:821px){#bottom{display:grid;grid-template-columns:1fr auto 1fr}}

.ovl{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:14px}
.card{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:16px;padding:20px;width:min(420px,100%);max-height:92vh;overflow:auto;color:#fff;font-family:var(--font)}
.card.wide{width:min(640px,100%)}
.toast{position:fixed;top:44px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:99px;font-weight:600;z-index:700;font-size:13px;box-shadow:0 8px 30px #0008}

/* settings / owner layout */
.set{display:flex;height:100%}
.set nav{width:150px;flex:none;border-right:1px solid #222;padding:10px;display:flex;flex-direction:column;gap:4px}
.set nav button{text-align:left;padding:8px 10px;border-radius:8px;color:#999;white-space:nowrap}
.set nav button.on{background:#fff;color:#000;font-weight:600}
.set section{flex:1;min-width:0;padding:16px;overflow:auto}
@container (max-width:520px){.set{flex-direction:column}.set nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid #222}}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #1a1a1a}
.row.col{flex-direction:column;align-items:flex-start}
.row label{font-weight:600}
.sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #333}
.sw:hover{border-color:#fff}
.cpick{width:34px;height:28px;border:0;background:none;padding:0}
input[type=range]{accent-color:#fff;width:150px}
.switch{appearance:none;width:42px;height:24px;border-radius:99px;background:#333;position:relative;cursor:pointer;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch:checked{background:#fff}.switch:checked::after{left:21px;background:#000}
.tblwrap{overflow:auto;border:1px solid #222;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #1a1a1a;white-space:nowrap}
th{color:#888;font-weight:600;position:sticky;top:0;background:#0a0a0a}

/* AI */
.ai{display:flex;flex-direction:column;height:100%}
.aimsgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:85%;padding:9px 12px;border-radius:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:#161616;border:1px solid #262626;border-bottom-left-radius:4px}
.aiform{display:flex;gap:8px;padding:10px;border-top:1px solid #222}

/* misc apps */
.pad{padding:16px;height:100%;overflow:auto}
.notes{width:100%;height:100%;background:#0a0a0a;border:0;outline:none;padding:16px;resize:none;line-height:1.6}
.calc{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px}
.cd{background:#111;border-radius:12px;padding:12px 14px;text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cd small{color:#777;min-height:16px;word-break:break-all}
.cv{font-size:30px;font-weight:600;word-break:break-all}
.ck{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck button{background:#151515;border:1px solid #262626;border-radius:12px;font-size:18px;font-weight:600}
.ck button:hover{background:#222}.ck button.op{background:#fff;color:#000}
.hv{display:flex;flex-direction:column;height:100%;gap:10px;padding:12px}
.hv textarea{flex:1;font-family:"Fira Code",ui-monospace,monospace;font-size:12px}
.hv iframe{flex:1;border:1px solid #222;border-radius:8px;background:#fff;display:none}
.upd{border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:12px}
.upd h3{font-size:14px}.upd small{color:#777}
.upd ul{margin:8px 0 0 18px;line-height:1.6;color:#ddd}
.cred{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-height:100%;line-height:1.5}
.cred h1{font-size:28px}.cred b{display:block;color:#888;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.cred small{color:#777;max-width:340px}

/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #222;flex:none}
.rooms,.ch-actions{display:flex;gap:6px}
.rooms button,.ch-actions button{padding:6px 11px;border-radius:8px;background:#141414;border:1px solid #2a2a2a;font-size:12px;font-weight:600}
.rooms button.on{background:#fff;color:#000}
.narrowonly{display:none}
.ch-main{flex:1;min-height:0;display:flex;position:relative}
.ch-col{flex:1;min-width:0;display:flex;flex-direction:column}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;padding:4px 6px;border-radius:10px}
.msg.me{background:#161616;box-shadow:inset 3px 0 0 #fff}
.msg .mh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.msg .nm{font-weight:600;cursor:pointer}
.msg .tm{color:#666;font-size:11px}
.msg .tx{word-break:break-word;line-height:1.45}
.men{background:#222;border-radius:5px;padding:0 4px}.men.me{background:#fff;color:#000;font-weight:600}
.composer{position:relative;display:flex;gap:8px;padding:10px;border-top:1px solid #222;flex:none}
.mention{position:absolute;left:10px;right:10px;bottom:100%;background:#0f0f0f;border:1px solid #2c2c2c;border-radius:10px;max-height:220px;overflow:auto;z-index:10;padding:4px}
.mention h5{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#777;padding:6px 8px 2px}
.mention button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px;text-align:left}
.mention button:hover,.mention button.hl{background:#222}
.ulist{width:190px;flex:none;border-left:1px solid #222;overflow:auto;padding:8px;background:#0a0a0a}
.ulist h4{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#777;margin:8px 6px 4px}
.urow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;width:100%;text-align:left}
.urow:hover{background:#181818}
.urow .un{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.urow.off{opacity:.45}
.dot{width:7px;height:7px;border-radius:50%;background:#28c840;flex:none}.off .dot{background:#555}
@container (max-width:620px){.ulist{position:absolute;right:0;top:0;bottom:0;z-index:6;display:none;box-shadow:-10px 0 30px #000}.ulist.show{display:block}.narrowonly{display:inline-flex}}
.av{border-radius:50%;background:#1a1a1a;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;margin:3px}
.av img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;background:#000;border:1px solid #333;color:#fff;font-weight:700;letter-spacing:.3px}
.tag.holy{animation:pw 1.8s ease-in-out infinite;border-color:#fff}
.tag.blood{color:#ff2a2a;border-color:#6b0000;animation:pr 1.6s ease-in-out infinite}
.tag.legend{border-color:#fff;letter-spacing:1.5px;box-shadow:0 0 8px #fff5}
@keyframes pw{0%,100%{box-shadow:0 0 0 0 #fff0}50%{box-shadow:0 0 12px 2px #fffb}}
@keyframes pr{0%,100%{box-shadow:0 0 0 0 #ff2a2a00}50%{box-shadow:0 0 12px 2px #ff2a2a99}}
.crates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.crate{border:1px solid #2a2a2a;border-radius:14px;padding:16px;text-align:center}
.crate .big{font-size:38px}
.inv{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.invi{padding:6px;border-radius:10px;border:1px solid #2a2a2a;background:#111;display:flex;align-items:center;gap:6px}
.invi.eq{border-color:#fff}
.shake{animation:sh .5s infinite}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.pop{animation:pp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pp{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* update part 1 */
.banner{margin:0 10px 6px;background:#2a0000;border:1px solid #5a1010;color:#ff7b7b;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;flex:none}
.emopop{position:absolute;left:10px;bottom:100%;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#0f0f0f;border:1px solid #2c2c2c;border-radius:10px;padding:6px;z-index:11}
.emopop button{font-size:20px;padding:4px;border-radius:6px;line-height:1}
.emopop button:hover{background:#222}
.composer .btn.ghost{padding:8px 10px}
.mimg{display:block;max-width:min(320px,100%);max-height:260px;border-radius:10px;margin-top:6px;cursor:zoom-in;border:1px solid #2a2a2a}
.reacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rbtn{padding:3px 8px;border-radius:99px;background:#141414;border:1px solid #2a2a2a;font-size:12px}
.rbtn:hover{border-color:#777}
.rbtn.on{background:#fff;color:#000;border-color:#fff}
.tag.role{border-color:#fff;letter-spacing:1px}
.links{display:flex;flex-direction:column;gap:6px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid #222;border-radius:10px;background:#101010;color:#fff;text-decoration:none;word-break:break-all}
.lnk:hover{border-color:#fff;background:#181818}
.lnk i{font-style:normal;color:#888;flex:none}

/* update part 2 */
.bal{font-weight:700;padding:6px 10px;border-radius:8px;background:#141414;border:1px solid #2a2a2a;font-size:12px;white-space:nowrap}
.fx-ice{color:#7dd3fc;text-shadow:0 0 8px #38bdf8aa}
.fx-fire{color:#ff4d2e;text-shadow:0 0 8px #ff4d2eaa}
.fx-earth{background:linear-gradient(90deg,#4ade80,#a16207);-webkit-background-clip:text;background-clip:text;color:transparent}
.fx-jolly{background:linear-gradient(90deg,#ef4444,#22c55e,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent}
.fx-hellfire{background:linear-gradient(90deg,#111,#ff1a1a,#111);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.6px #ff2a2a}
.tag.holly{background:#000;border-color:#333}
.tag.holly b{background:linear-gradient(90deg,#ff3b30,#34c759);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.tag.acid{background:#22c55e;color:#7e22ce;border-color:#16a34a}
.wheelbox{position:relative;width:260px;height:260px;margin:14px auto}
.wheelbox canvas{width:260px;height:260px;border-radius:50%;box-shadow:0 0 30px #0008;display:block}
.wheelbox .ptr{position:absolute;top:-10px;left:50%;margin-left:-10px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:20px solid #fff;z-index:2}
.odds{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 12px}
.odds span{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid #2a2a2a;color:#bbb}

/* update part 3: cosmetics */
@keyframes gp{0%,100%{filter:drop-shadow(0 0 2px var(--g))}50%{filter:drop-shadow(0 0 11px var(--g))}}
@keyframes flow{from{background-position:0 0}to{background-position:100% 0}}
@keyframes flowb{to{background-position:0 0,100% 0}}
@keyframes bp{0%,100%{box-shadow:0 0 6px var(--g)}50%{box-shadow:0 0 22px 2px var(--g)}}
@keyframes fade{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes jit{0%,100%{transform:translate(0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes fl{0%,100%{text-shadow:0 0 4px #ef4444}50%{text-shadow:0 0 12px #f97316,0 0 2px #fde047}}
@keyframes rc{0%,100%{box-shadow:0 0 0 3px #ff3b30,0 0 14px 3px #ff3b30aa}17%{box-shadow:0 0 0 3px #ff9500,0 0 14px 3px #ff9500aa}33%{box-shadow:0 0 0 3px #ffcc00,0 0 14px 3px #ffcc00aa}50%{box-shadow:0 0 0 3px #34c759,0 0 14px 3px #34c759aa}67%{box-shadow:0 0 0 3px #32ade6,0 0 14px 3px #32ade6aa}83%{box-shadow:0 0 0 3px #bf5af2,0 0 14px 3px #bf5af2aa}}
@keyframes ra{0%,100%{box-shadow:0 0 0 3px #34d399,0 0 14px 3px #34d399aa}33%{box-shadow:0 0 0 3px #22d3ee,0 0 14px 3px #22d3eeaa}66%{box-shadow:0 0 0 3px #a78bfa,0 0 14px 3px #a78bfaaa}}
@keyframes rg{0%,100%{box-shadow:0 0 0 3px #7c3aed,0 0 16px 4px #7c3aedaa,0 0 28px 8px #2563eb55}50%{box-shadow:0 0 0 3px #ec4899,0 0 16px 4px #ec4899aa,0 0 28px 8px #7c3aed55}}

/* cursor */
#cdot,#cring{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;display:none}
#cdot{width:calc(var(--cs)/2);height:calc(var(--cs)/2);margin:calc(var(--cs)/-4) 0 0 calc(var(--cs)/-4);background:var(--cc);border-radius:50%}
#cring{width:var(--cs);height:var(--cs);margin:calc(var(--cs)/-2) 0 0 calc(var(--cs)/-2);border:2px solid var(--cc);border-radius:50%}
body[data-cur="cross"] #cdot{width:var(--cs);height:var(--cs);margin:calc(var(--cs)/-2) 0 0 calc(var(--cs)/-2);background:none;border-radius:0}
body[data-cur="cross"] #cdot::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--cc)}
body[data-cur="cross"] #cdot::after{content:"";position:absolute;top:50%;left:0;right:0;height:2px;margin-top:-1px;background:var(--cc)}
@media(pointer:fine){
 body:not([data-cur="system"]) *{cursor:none!important}
 body[data-cur="dot"] #cdot,body[data-cur="both"] #cdot,body[data-cur="cross"] #cdot{display:block}
 body[data-cur="ring"] #cring,body[data-cur="both"] #cring{display:block}
}

/* ================= cosmetics v2: animated rings and bubbles ================= */
.avr{position:relative;display:inline-block;flex:none;border-radius:50%;margin:3px;vertical-align:middle;--t:3px;--sp:3s;--dir:normal;--dl:0s;box-shadow:0 0 var(--gb,0px) var(--g,#0000)}
.avr .av{margin:0;width:100%;height:100%}
.avr::before,.avr::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.avr[class*="f-"]::before{inset:calc(var(--t)*-1 - 1.5px);background:var(--bg,conic-gradient(var(--c,#fff),var(--c,#fff)));-webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - var(--t)),#000 calc(100% - var(--t) + .6px));mask:radial-gradient(farthest-side,#0000 calc(100% - var(--t)),#000 calc(100% - var(--t) + .6px));animation:rxspin var(--sp) linear infinite var(--dir);animation-delay:var(--dl);will-change:transform}
.avr.f-orbit::after{inset:calc(var(--t)*-1 - 5px);background:radial-gradient(circle at 50% 3px,var(--dot,#fff) 0 2px,#0000 3.2px);animation:rxspin var(--osp,2.4s) linear infinite;animation-delay:var(--dl)}
.avr.f-wave::after{inset:calc(var(--t)*-1 - 1.5px);border:2px solid var(--w,#fff);opacity:0;animation:rxwave 2.4s ease-out infinite;animation-delay:var(--dl)}
.avr.f-dash{--bg:repeating-conic-gradient(var(--c1,#fff) 0 14deg,var(--c2,#0000) 14deg 28deg)}
.avr.f-flick::before{animation:rxspin var(--sp) linear infinite var(--dir),rxflick 2.4s steps(1) infinite;animation-delay:var(--dl)}
.avr.f-hue::before{animation:rxspin var(--sp) linear infinite var(--dir),rxhue 5s linear infinite;animation-delay:var(--dl)}
.avr.f-rev{--dir:reverse}
@keyframes rxspin{to{transform:rotate(360deg)}}
@keyframes rxwave{0%{transform:scale(.96);opacity:.85}100%{transform:scale(1.6);opacity:0}}
@keyframes rxflick{0%,100%{opacity:1}8%{opacity:.5}12%{opacity:1}46%{opacity:.75}50%{opacity:1}}
@keyframes rxhue{to{filter:hue-rotate(360deg)}}

function evalMath(src){
 let s=src.toLowerCase().replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\bplus\b/g,'+').replace(/\bminus\b/g,'-').replace(/\b(times|multiplied by)\b/g,'*').replace(/\b(divided by|over)\b/g,'/').replace(/\bto the power of\b/g,'^').replace(/\*\*/g,'^').replace(/\bsquared\b/g,'^2').replace(/\bcubed\b/g,'^3').replace(/\bmod\b/g,'%').replace(/(\d)\s*x\s*(\d)/g,'$1*$2');
 const tk=s.match(/\d*\.?\d+|[a-z]+|[-+*/^%(),]/g)||[];let i=0;
 const peek=()=>tk[i],nx=()=>tk[i++];
 const rad=x=>x*Math.PI/180;
 const F={sqrt:Math.sqrt,abs:Math.abs,sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),log:Math.log10,ln:Math.log,round:Math.round,floor:Math.floor,ceil:Math.ceil};
 const group=()=>{const v=expr();if(nx()!==')')throw 0;return v};
 const prim=()=>{const t=nx();if(t==null)throw 0;
  if(/^[\d.]/.test(t))return parseFloat(t);
  if(t==='(')return group();
  if(t==='-')return -pw();if(t==='+')return pw();
  if(t==='pi')return Math.PI;if(t==='e')return Math.E;
  if(F[t]){const a=peek()==='('?(nx(),group()):pw();return F[t](a)}
  throw 0};
 const pw=()=>{const b=prim();if(peek()==='^'){nx();return Math.pow(b,pw())}return b};
 const term=()=>{let v=pw();while(['*','/','%'].includes(peek())){const o=nx(),r=pw();v=o==='*'?v*r:o==='/'?v/r:v%r}return v};
 const expr=()=>{let v=term();while(peek()==='+'||peek()==='-'){const o=nx(),r=term();v=o==='+'?v+r:v-r}return v};
 const v=expr();if(i<tk.length||!isFinite(v))throw 0;return Math.round(v*1e10)/1e10;
}

async function wiki(q){
 let topic=q.replace(/^(who|what|where|when|why|how)\b('s|s)?\s*/i,'').replace(/^(is|are|was|were|does|do|did)\s+/i,'').replace(/^(a|an|the)\s+/i,'').replace(/^(define|explain|describe|tell me about|meaning of)\s+/i,'').trim()||q;
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),7000);
 try{
  const s=await fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(topic)+'&srlimit=1&format=json&origin=*',{signal:ctl.signal}).then(r=>r.json());
  const hit=s.query?.search?.[0];if(!hit)return null;
  const sum=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(hit.title.replace(/ /g,'_')),{signal:ctl.signal}).then(r=>r.json());
  return sum.extract?sum.extract+'\n\n(Wikipedia: '+sum.title+')':null;
 }catch{return null}finally{clearTimeout(to)}
}
async function answer(q){
 const t=q.toLowerCase().trim().replace(/[?!.]+$/,'');let m;
 if(/^(hi|hello|hey|yo|sup)\b/.test(t))return "Hey! Ask me math, conversions, facts, or how anything in Leafy's Space works.";
 if(/how are you/.test(t))return "Running fast and feeling good. What do you need?";
 if(/(who are you|your name|what are you)/.test(t))return "I'm Leafy AI, the built-in helper. I do instant math and conversions, look up facts, and explain the OS.";
 if(/^(thanks|thank you|ty)/.test(t))return "Anytime!";
 if(/\b(what|tell).*\btime\b/.test(t))return "It's "+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+".";
 if(/\b(what|tell).*\b(date|day)\b/.test(t)&&!/(rain|today's weather)/.test(t))return "Today is "+new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})+".";
 if(/joke/.test(t))return pick(JOKES);
 if(/(flip a coin|coin flip)/.test(t))return pick(['Heads.','Tails.']);
 if(/roll (a )?(die|dice|d6)/.test(t))return 'You rolled a '+(1+Math.floor(Math.random()*6))+'.';
 if(m=t.match(/random number (?:between )?(-?\d+) (?:and|to) (-?\d+)/)){const a=+m[1],b=+m[2];return String(Math.min(a,b)+Math.floor(Math.random()*(Math.abs(b-a)+1)))}
 if(/\b(how|where|can i|change|set|turn|make|what is the)\b/.test(t)){const h=HELP.find(h=>h.k.test(t));if(h)return h.a}
 if(m=t.match(/(-?\d+\.?\d*)\s*%\s*of\s*(-?\d+\.?\d*)/))return `${m[1]}% of ${m[2]} = ${Math.round(m[1]*m[2])/100}`;
 if(m=t.match(/(-?\d+\.?\d*)\s*([a-z°]+)\s+(?:to|in|into)\s+([a-z°]+)/)){const a=ALIAS[m[2]],b=ALIAS[m[3]];if(a&&b){const r=convert(+m[1],a,b);if(r!=null)return `${m[1]} ${m[2]} = ${Math.round(r*1e6)/1e6} ${m[3]}`}}
 if(/\d/.test(t)){const ex=t.replace(/^(what('s| is)|whats|calculate|compute|solve|evaluate|=)\s*/,'');try{return ex+' = '+evalMath(ex)}catch{}}
 const w=await wiki(q);
 return w||"I couldn't find that. Try rephrasing, or ask me something like 'what is photosynthesis', '15% of 80', or '10 km to miles'.";
}

 while((m=re.exec(t))){

  else if(m[3])out+=escH(m[2])+'<span class="tk-t">'+escH(m[3])+'</span>';
  else out+='<span class="tk-a">'+escH(m[4])+'</span>';

function hlCode(src,lang){
 if(lang==='html'){
  const re=/(<!--[\s\S]*?(?:-->|$))|(<(script|style)\b[^>]*>)([\s\S]*?)(<\/\3\s*>|$)|(<\/?[A-Za-z!][^>]*>?)/gi;
  let out='',last=0,m;
  while((m=re.exec(src))){
   out+=escH(src.slice(last,m.index));
   if(m[1])out+='<span class="tk-c">'+escH(m[1])+'</span>';
   else if(m[2])out+=hlTag(m[2])+(m[3].toLowerCase()==='script'?hlCode(m[4],'js'):escH(m[4]))+hlTag(m[5]);
   else out+=hlTag(m[6]);
   last=re.lastIndex;if(m[0].length===0)re.lastIndex++}
  return out+escH(src.slice(last));
 }
 const re=CODE_RE[lang];if(!re)return escH(src);

 re.lastIndex=0;let out='',last=0,m;
 while((m=re.exec(src))){
  if(m.index>last)out+=escH(src.slice(last,m.index));
  const g=m.groups;
  const cls=g.c!==undefined?'c':g.p!==undefined?'p':g.s!==undefined?'s':g.n!==undefined?'n':(kws.has(m[0])?'k':'');
  out+=cls?'<span class="tk-'+cls+'">'+escH(m[0])+'</span>':escH(m[0]);
  last=re.lastIndex;if(m[0].length===0)re.lastIndex++}

}

const DUPE_PAY={legendary:1000,mythic:2000},DUPE_CAP=30000; /* a duplicate legendary pays 1000 Leaves, a duplicate mythic 2000; the rules cap the bonus at DUPE_CAP per day */
async function payDupe(amount){ /* a separate write after the crate is saved, so the crate itself stays a normal paid write */
 if(!amount||S.isOwner)return 0;
 const p=S.profile,today=Math.floor(Date.now()/864e5),same=p.dupeDay===today,room=DUPE_CAP-(same?(p.dupeNet||0):0),pay=Math.min(amount,room);
 if(pay<=0){toast('Daily duplicate bonus limit reached ('+DUPE_CAP+' 🍃)');return 0}
 try{await fb.updateDoc(D('users',S.user.uid),{leaves:fb.increment(pay),dupeDay:today,dupeNet:same?fb.increment(pay):pay});if(pay<amount)toast('Duplicate bonus reduced: daily limit is '+DUPE_CAP+' 🍃');return pay}
 catch(e){console.error(e);toast('Could not add the duplicate bonus');return 0}}

async function crateBulk(k,n){
 const c=CATS[k],p=S.profile,lv=p.leaves??0,have=p[c.ck]||0;n=Math.floor(n);
 if(!(n>=1)||n>500)return{err:'Pick a number from 1 to 500'};
 const use=Math.min(have,n),paidN=n-use,cost=paidN*COST[k];
 if(lv<cost)return{err:'You can only open '+(have+Math.floor(lv/COST[k]))+' of these (crates you own plus what your Leaves can buy)'};
 const own=new Set(owned(k,p).map(x=>x.id)),adds={},list=[],bon=[];let refund=0;
 for(let i=0;i<n;i++){
  const item=rollItem(pool(k)),dupe=own.has(item.id);own.add(item.id);snAddTo(adds,c.key,item.id);list.push({k,x:item,dupe});
  if(dupe&&!S.isOwner)refund+=DUPE_PAY[item.rar]||0;
  const bn=packBonus(p);if(bn){snAddTo(adds,bn.kind,bn.it.id);bon.push(snBon(bn))}
  const sb=seasonBonus(p,k);if(sb){snAddTo(adds,sb.c.key,sb.it.id);bon.push(sb.it.name)}}
 const d=snArr(adds);if(use>0)d[c.ck]=have-use;if(paidN>0)d.leaves=lv-cost;
 if(!await saveP(d))return{err:'Could not open the crates'};
 qBump('crate',n);return{n,list,bon,refund,paid:await payDupe(refund)}}
async function seasonBulk(sid,n){

 if(!s||!snStatus(s).open)return{err:'That crate has closed. Come back next year!'};

 if(lv<cost)return{err:'You can only open '+(have+Math.floor(lv/SEASON_COST))+' (you own '+have+' seasonal crates, each other one costs '+SEASON_COST+' 🍃)'};
 let pc=(p.spity&&p.spity[sid])||0;const ownA={},adds={},list=[];let refund=0;
 for(let i=0;i<n;i++){
  let rar='common';

  else{let t=Math.random()*100;for(const r of SEASON_RARS){if((t-=SEASON_W[r])<0){rar=r;break}}}
  const k=SEASON_TYPES[Math.floor(Math.random()*4)],c=CATS[k],item=c.list.find(x=>x.season===sid&&x.rar===rar),o=ownA[k]||(ownA[k]=new Set(owned(k,p).map(x=>x.id))),dupe=o.has(item.id);

  {id:'fire',g:'🔥',t:'On fire',rar:'rare'},{id:'wow',g:'🤯',t:'WOW',rar:'epic'},{id:'king',g:'👑',t:'Bow down',rar:'legendary'},{id:'unicorn',g:'🦄',t:'Magical',rar:'mythic'}]

const PK_E=Object.fromEntries(PACK.emojis.map(x=>[x.id,x])),PK_S=Object.fromEntries(PACK.stickers.map(x=>[x.id,x]));
const pkArt=(x,sz)=>x.img?`<img src="${esc(x.img)}" alt="" style="width:${sz}px;height:${sz}px;object-fit:contain">`:`<span style="font-size:${Math.round(sz*.85)}px;line-height:1">${x.g}</span>`;
const cemoText=t=>t.replace(/:([a-z0-9_]{2,20}):/g,(a,n)=>PK_E[n]?`<span class="cemo" title=":${n}:">${pkArt(PK_E[n],22)}</span>`:a);
const stkHTML=t=>{const m=/^\[st:([a-z0-9_]{2,20})\]$/.exec(t||''),s=m&&PK_S[m[1]];return s?`<div class="stk" style="--rc:${RAR[s.rar].c}">${pkArt(s,72)}${s.t?`<span>${esc(s.t)}</span>`:''}</div>`:''};
const rollPack=l=>roll(l.map(x=>({...x,w:RAR[x.rar].w||1})));
function packBonus(p){ /* 20% of crate openings and wheel spins also drop an emoji or sticker you don't own yet */
 if(Math.random()>.2)return null;const kind=Math.random()<.5?'emojis':'stickers',have=new Set(p[kind]||[]),list=PACK[kind].filter(x=>!have.has(x.id));
 if(!list.length)return null;return{kind,it:rollPack(list)}}
const packToast=bn=>toast('🎁 Bonus '+(bn.kind==='emojis'?'emoji':'sticker')+': '+bn.it.g+' '+(bn.kind==='emojis'?':'+bn.it.id+':':bn.it.t||''));

  $('#pg',m.el).innerHTML='<div class="pkg">'+PACK[tab].map(x=>{const ok=has(tab,x.id);return `<button class="pkc${ok?'':' lock'}" style="--rc:${RAR[x.rar].c}" data-i="${x.id}">${pkArt(x,36)}<span style="font-size:10px">${tab==='emojis'?':'+x.id+':':esc(x.t||'')}</span>${ok?'':'<span style="font-size:10px">🔒 '+RAR[x.rar].n+'</span>'}</button>`}).join('')+'</div>'};

/* ---- streaks, weekly counters, weekly prizes ---- */
const PRIZES=[1500,900,450];
async function streakTick(){
 const p=S.profile;if(!p||S.guest||p.streakDay===dayNow())return;
 const streak=p.streakDay===dayNow()-1?(p.streak||0)+1:1;
 try{await fb.updateDoc(D('users',S.user.uid),{streak,streakDay:dayNow(),bestStreak:Math.max(p.bestStreak||0,streak)})}catch(e){console.error('streak',e)}}
async function winSync(){
 const p=S.profile;if(!p||S.guest)return;const w=weekN(),cur=(p.aiWins||0)+(p.pvpWins||0),seen=p.wkSeen===undefined?cur:p.wkSeen;
 if(p.wkWinN===w&&p.wkSeen===cur)return;
 const base=p.wkWinN===w?(p.wkWins||0):0;
 try{await fb.updateDoc(D('users',S.user.uid),{wkWinN:w,wkSeen:cur,wkWins:base+(cur-seen)})}catch(e){console.error('winsync',e)}}
async function lbClaimCheck(){
 const p=S.profile;if(!p||S.guest)return;const w=weekN()-1;if(w<0||(p.lbClaim||0)>=w)return;
 try{const d=await fb.getDoc(D('lbResults',String(w)));if(!d.exists())return;const r=(d.data().rewards||{})[S.user.uid]||0;if(r<=0)return;
  await fb.updateDoc(D('users',S.user.uid),{leaves:(S.profile.leaves||0)+r,lbClaim:w});toast('🏆 Weekly leaderboard prize: +'+r+' 🍃')}catch(e){console.error('lbclaim',e)}}
function boardRows(kind){
 const w=weekN(),val={rich:u=>u.leaves||0,msgs:u=>u.wkN===w?(u.wkMsgs||0):0,streak:u=>u.bestStreak||0,wins:u=>u.wkWinN===w?(u.wkWins||0):0}[kind];
 return Object.values(S.users||{}).filter(u=>u.username&&u.id!==2&&!u.banned&&!(kind==='rich'&&rankOf(u)>=4)).map(u=>({u,v:val(u)})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v||(a.u.id-b.u.id))}
async function settleBoards(){ /* owners pay out last week's top 3 */
 if(!S.isOwner||!S.users)return;const w=weekN()-1;if(w<0)return;const ref=D('lbResults',String(w));
 try{if((await fb.getDoc(ref)).exists())return;
  const top=k=>{const val=k==='msgs'?u=>u.wkN===w?(u.wkMsgs||0):0:u=>u.wkWinN===w?(u.wkWins||0):0;
   return Object.values(S.users).filter(u=>u.id!==2&&!u.banned&&val(u)>0).sort((a,b)=>val(b)-val(a)||a.id-b.id).slice(0,3).map(u=>u.uid)};
  const msgs=top('msgs'),wins=top('wins'),rewards={};
  [msgs,wins].forEach(l=>l.forEach((id,i)=>{rewards[id]=(rewards[id]||0)+PRIZES[i]}));
  await fb.setDoc(ref,{week:w,msgs,wins,rewards,at:fb.serverTimestamp()})}catch(e){console.error('settle boards',e)}}
function renderBoards(body){
 let tab='msgs';settleBoards();winSync().then(()=>paint());
 const T={msgs:['💬 Messages','this week'],wins:['🏆 Game wins','this week'],streak:['🔥 Streak','best, in days'],rich:['🍃 Richest','leaves']};
 const set=h=>{body.innerHTML='<div class="arc">'+h+'</div>'};
 function paint(){
  const rows=boardRows(tab),me=S.user&&S.user.uid,w=weekN(),endIn=weekEndMs(w)-Date.now(),days=Math.floor(endIn/864e5),hrs=Math.floor(endIn%864e5/36e5);
  const weekly=tab==='msgs'||tab==='wins',idx=rows.findIndex(r=>r.u.uid===me);
  set(`<div style="display:flex;align-items:center;margin-bottom:10px"><h3 style="flex:1">🏆 Leaderboards</h3><span class="muted">🍃 ${((S.profile||{}).leaves||0).toLocaleString()}</span></div>
  <div class="tb2">${Object.entries(T).map(([k,v])=>`<button class="btn ghost sm${tab===k?' on':''}" data-t="${k}">${v[0]}</button>`).join('')}</div>
  <p class="note" style="margin:8px 0">${T[tab][0]} · ${T[tab][1]}${weekly?` · resets in ${days}d ${hrs}h · prizes for the top 3: ${PRIZES.join(' / ')} 🍃`:''}</p>
  ${rows.slice(0,25).map((r,i)=>`<div class="rowl"${r.u.uid===me?' style="outline:1px solid #4ade80"':''}><b style="width:28px">${i<3?['🥇','🥈','🥉'][i]:i+1}</b><div class="gr">${nameHTML(r.u)}${tab==='streak'&&r.u.streakDay>=dayNow()-1?` <span class="muted">· now ${r.u.streak||0}</span>`:''}</div><b>${r.v.toLocaleString()}</b></div>`).join('')||'<p class="muted">Nobody on this board yet.</p>'}
  ${idx>=25?`<p class="note">You are #${idx+1} with ${rows[idx].v.toLocaleString()}.</p>`:''}
  <p class="note" style="margin-top:12px">Weekly boards reset every week. The week's top 3 for Messages and Game wins get paid automatically when the next week starts.</p>`)}
 body.onclick=e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;paint()}};
 const iv=setInterval(paint,20000);paint();return()=>clearInterval(iv)}

/* ---- marketplace: sell crates and cosmetics for leaves (5% fee) ---- */
const mFee=p=>Math.floor(p/20);
function renderMarket(body){
 let tab='browse',rows=[],mine=[],filt='all',busy=false;const unsub=[];
 const uid=()=>S.user.uid,P=()=>S.profile||{};
 const crateCat=f=>f===SNK?{e:'🎁',n:'Seasonal'}:Object.values(CATS).find(c=>c.ck===f),itemCat=f=>Object.values(CATS).find(c=>c.key===f);
 const label=m=>{if(m.kind==='crate'){const c=crateCat(m.field);return `${c?c.e+' '+c.n:'?'} crate ×${m.qty}`}
  const c=itemCat(m.field),x=c&&c.list.find(y=>y.id===m.item);return x?`<span style="display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap">${preview(c.k,x)} ${rarLabel(x)}</span>`:esc(m.item)};
 const set=h=>{body.innerHTML='<div class="arc">'+h+'</div>'};
 function paint(){
  if(S.guest||!S.profile)return set('<h3>🛒 Market</h3><p class="muted">Sign in to trade.</p>');
  const open=rows.filter(m=>m.status==='open'&&m.seller!==uid()&&(filt==='all'||(filt==='crate'?m.kind==='crate':m.field===filt))).sort((a,b)=>a.price-b.price);
  const my=mine.filter(m=>m.status==='open'||(m.status==='sold'&&!m.collected));
  const owe=my.filter(m=>m.status==='sold').length;
  let h=`<div style="display:flex;align-items:center;margin-bottom:10px"><h3 style="flex:1">🛒 Market</h3><span class="muted">🍃 ${(P().leaves||0).toLocaleString()}</span></div>
  <div class="tb2">${[['browse','Browse'],['sell','Sell'],['mine','My listings'+(my.length?' ('+my.length+')':'')+(owe?' 💰':'')]].map(([k,l])=>`<button class="btn ghost sm${tab===k?' on':''}" data-t="${k}">${l}</button>`).join('')}</div>`;
  if(tab==='browse'){
   h+=`<select class="inp" id="mf" style="margin:10px 0"><option value="all">Everything</option><option value="crate">Crates</option>${Object.values(CATS).map(c=>`<option value="${c.key}">${c.pl}</option>`).join('')}</select>`;
   h+=open.map(m=>`<div class="mkrow"><div style="flex:1;min-width:150px">${label(m)}<div class="muted" style="font-size:11px">by ${esc(mName(m.seller))}</div></div><b>${m.price.toLocaleString()} 🍃</b><button class="btn sm" data-buy="${m.id}">Buy</button></div>`).join('')||'<p class="muted" style="margin-top:10px">Nothing for sale right now.</p>'
  }else if(tab==='sell'){
   const p=P(),opts=[];
   Object.values(CATS).forEach(c=>{const n=p[c.ck]||0;if(n>0)opts.push(`<option value="c:${c.ck}">${c.e} ${c.n} crates (you have ${n})</option>`)});
    {const n=p[SNK]||0;if(n>0)opts.push(`<option value="c:${SNK}">🎁 Seasonal crates (you have ${n})</option>`)}
   Object.values(CATS).forEach(c=>(p[c.key]||[]).forEach(id=>{const x=c.list.find(y=>y.id===id);if(!x||id===p[c.eq])return;opts.push(`<option value="i:${c.key}:${id}">${c.e} ${esc(x.name||x.text||id)} · ${RAR[x.rar].n}</option>`)}));
   h+=opts.length?`<p class="note" style="margin:10px 0">Items you have equipped can't be sold. The item leaves your inventory until it sells or you cancel. A 5% fee is taken from the sale.</p>
   <label class="muted">What do you want to sell?</label><select class="inp" id="mw" style="margin:4px 0 8px">${opts.join('')}</select>
   <div style="display:flex;gap:8px"><div style="flex:1"><label class="muted">Amount (crates)</label><input class="inp" id="mq" type="number" min="1" step="1" value="1"></div><div style="flex:1"><label class="muted">Price (🍃)</label><input class="inp" id="mp" type="number" min="1" step="1" value="100"></div></div>
   <button class="btn" id="ml" style="width:100%;margin-top:10px">List for sale</button>`:'<p class="muted" style="margin-top:10px">You have no crates or unequipped items to sell.</p>';
  }else{
   h+=my.map(m=>m.status==='sold'?`<div class="mkrow"><div style="flex:1;min-width:150px">${label(m)}<div class="muted" style="font-size:11px">Sold! Payout ${(m.price-mFee(m.price)).toLocaleString()} 🍃 after the fee</div></div><button class="btn sm" data-col="${m.id}">Collect</button></div>`
    :`<div class="mkrow"><div style="flex:1;min-width:150px">${label(m)}<div class="muted" style="font-size:11px">Listed at ${m.price.toLocaleString()} 🍃</div></div><button class="btn ghost sm" data-can="${m.id}">Cancel</button></div>`).join('')||'<p class="muted" style="margin-top:10px">You have no active listings.</p>'}
  set(h);const f=$('#mf',body);if(f)f.value=filt}
 const find=id=>rows.find(m=>m.id===id)||mine.find(m=>m.id===id);
 async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){console.error(e);toast('Failed: '+(e.code||e.message))}busy=false;paint()}
 const send=(mid,mu,upd)=>{const bt=fb.writeBatch(fb.db);bt.update(D('market',mid),mu);bt.update(D('users',uid()),upd);return bt.commit()};
 body.onchange=e=>{if(e.target.id==='mf'){filt=e.target.value;paint()}};
 body.onclick=e=>{
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;return paint()}
  let n;
  if((n=e.target.closest('[data-buy]')))return run(async()=>{const m=find(n.dataset.buy),p=P();if(!m||m.status!=='open')throw new Error('That listing is gone');

    doc={kind:'crate',field:w[1],item:'',qty};upd={[w[1]]:have-qty}}
   else{doc={kind:'item',field:w[1],item:w[2],qty:1};upd={[w[1]]:fb.arrayRemove(w[2])}}
   upd.lastMarket=id+':l';
   const bt=fb.writeBatch(fb.db);bt.set(D('market',id),{seller:uid(),...doc,price,status:'open',buyer:'',collected:false,ts:fb.serverTimestamp()});bt.update(D('users',uid()),upd);await bt.commit();
   toast('Listed!');tab='mine'});
 };
 if(!S.guest&&S.user){
  unsub.push(fb.onSnapshot(fb.query(C('market'),fb.where('status','==','open')),s=>{rows=[];s.forEach(d=>rows.push({id:d.id,...d.data()}));paint()},e=>console.error('market',e)));

  set(`<h3 style="margin-bottom:10px">🚩 Reports</h3><div class="tb2">${['open','resolved','dismissed','all'].map(k=>`<button class="btn ghost sm${f===k?' on':''}" data-f="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
  ${l.map(r=>`<div class="resbox" style="margin-top:10px"><b>${esc(mName(r.target))}</b> <span class="muted">reported by ${esc(mName(r.by))} · ${esc(r.reason)}</span>${r.text?`<div class="muted" style="margin:4px 0">“${esc(r.text)}”</div>`:''}${r.detail?`<div style="margin:4px 0">${esc(r.detail)}</div>`:''}
  <div style="display:flex;gap:6px;margin-top:6px">${r.status==='open'?`<button class="btn sm" data-s="resolved:${r.id}">Resolve</button><button class="btn ghost sm" data-s="dismissed:${r.id}">Dismiss</button>`:`<button class="btn ghost sm" data-s="open:${r.id}">Reopen</button>`}${myRank()>=2?`<button class="btn ghost sm" data-d="${r.id}">Delete</button>`:''}</div></div>`).join('')||'<p class="muted" style="margin-top:10px">Nothing here.</p>'}`)}
 body.onclick=async e=>{let n;try{
  if((n=e.target.closest('[data-f]'))){f=n.dataset.f;return paint()}
  if((n=e.target.closest('[data-s]'))){const [s,id]=n.dataset.s.split(':');return void await fb.updateDoc(D('reports',id),{status:s})}
  if((n=e.target.closest('[data-d]')))return void await fb.deleteDoc(D('reports',n.dataset.d))}catch(err){console.error(err);toast('Failed: '+(err.code||err.message))}};
 const un=myRank()>=1?fb.onSnapshot(C('reports'),s=>{rows=[];s.forEach(d=>rows.push({id:d.id,...d.data()}));paint()},e=>console.error('reports',e)):()=>{};
 paint();return()=>{try{un()}catch{}}}

/* ================= DRAWING APP ================= */
function renderDraw(b){
 const COLORS=['#000000','#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ffffff'];
 b.innerHTML=`<div class="dr"><div class="tools">
  ${[['pen','✏️ Pen'],['eraser','🧽 Eraser'],['line','╱ Line'],['rect','▭ Box'],['oval','◯ Oval']].map(([k,n],i)=>`<button class="btn ghost sm${i?'':' on'}" data-t="${k}">${n}</button>`).join('')}
  <input type="color" id="dc" value="#000000" title="Pick a color" style="width:30px;height:28px;padding:0;border:0;background:none">
  ${COLORS.map(c=>`<button class="sw" data-c="${c}" title="${c}" style="background:${c}"></button>`).join('')}
  <input type="range" id="dsz" min="1" max="40" value="4" style="width:90px" title="Brush size"><span class="muted" id="dsv" style="font-size:12px;width:18px">4</span>
  <button class="btn ghost sm" id="du">Undo</button><button class="btn ghost sm" id="dre">Redo</button><button class="btn ghost sm" id="dcl">Clear</button><button class="btn sm" id="dsave">Save PNG</button>
 </div><div class="cwrap"><canvas></canvas></div></div>`;
 const cv=$('canvas',b),wrap=$('.cwrap',b),ctx=cv.getContext('2d',{willReadFrequently:true});
 let tool='pen',color='#000000',size=4,undo=[],redo=[],drawing=false,sx=0,sy=0,lx=0,ly=0,snap=null,dpr=1;
 const fit=()=>{
  const w=wrap.clientWidth,h=wrap.clientHeight;if(!w||!h)return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  const nw=Math.round(w*dpr),nh=Math.round(h*dpr);
  if(cv.width===nw&&cv.height===nh)return;
  let old=null;
  if(cv.width&&cv.height&&undo.length+1>=0&&cv.dataset.init){old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;old.getContext('2d').drawImage(cv,0,0)}
  cv.width=nw;cv.height=nh;ctx.fillStyle='#fff';ctx.fillRect(0,0,nw,nh);
  if(old)ctx.drawImage(old,0,0);
  cv.dataset.init='1';undo=[];redo=[];
 };
 const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 const push=()=>{try{undo.push(ctx.getImageData(0,0,cv.width,cv.height));if(undo.length>25)undo.shift();redo=[]}catch{}};
 const style=()=>{ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=size*dpr*(tool==='eraser'?3:1);ctx.strokeStyle=tool==='eraser'?'#ffffff':color;ctx.fillStyle=ctx.strokeStyle};
 cv.addEventListener('pointerdown',e=>{
  e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch{}
  push();drawing=true;[sx,sy]=pos(e);lx=sx;ly=sy;style();
  if(tool==='pen'||tool==='eraser'){ctx.beginPath();ctx.arc(sx,sy,ctx.lineWidth/2,0,6.2832);ctx.fill()}
  else snap=ctx.getImageData(0,0,cv.width,cv.height)});
 cv.addEventListener('pointermove',e=>{
  if(!drawing)return;const[x,y]=pos(e);
  if(tool==='pen'||tool==='eraser'){ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y}
  else{
   ctx.putImageData(snap,0,0);style();ctx.beginPath();
   if(tool==='line'){ctx.moveTo(sx,sy);ctx.lineTo(x,y)}
   else if(tool==='rect')ctx.rect(sx,sy,x-sx,y-sy);
   else ctx.ellipse((sx+x)/2,(sy+y)/2,Math.abs(x-sx)/2,Math.abs(y-sy)/2,0,0,6.2832);
   ctx.stroke()}});
 const end=()=>{drawing=false;snap=null};
 cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 const setTool=t=>{tool=t;$$('[data-t]',b).forEach(x=>x.classList.toggle('on',x.dataset.t===t))};
 const setColor=c=>{color=c;$('#dc',b).value=c;$$('.sw',b).forEach(x=>x.classList.toggle('on',x.dataset.c===c));if(tool==='eraser')setTool('pen')};
 $$('[data-t]',b).forEach(x=>x.onclick=()=>setTool(x.dataset.t));
 $$('.sw',b).forEach(x=>x.onclick=()=>setColor(x.dataset.c));
 $('#dc',b).oninput=e=>setColor(e.target.value);
 $('#dsz',b).oninput=e=>{size=+e.target.value;$('#dsv',b).textContent=size};
 $('#du',b).onclick=()=>{if(!undo.length)return;redo.push(ctx.getImageData(0,0,cv.width,cv.height));ctx.putImageData(undo.pop(),0,0)};
 $('#dre',b).onclick=()=>{if(!redo.length)return;undo.push(ctx.getImageData(0,0,cv.width,cv.height));ctx.putImageData(redo.pop(),0,0)};
 $('#dcl',b).onclick=()=>{push();ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)};
 $('#dsave',b).onclick=()=>cv.toBlob(bl=>{if(!bl)return toast('Could not save the drawing');const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='leafy-drawing.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)});
 setColor('#000000');
 const ro=new ResizeObserver(fit);ro.observe(wrap);fit();
 return()=>ro.disconnect();
}

/* ================= LINK SHARING ================= */
const safeUrl=u=>{try{const x=new URL(String(u));return /^https?:$/.test(x.protocol)?x.href:null}catch{return null}};
function renderLinks(b){
 const ready=()=>!!(fb&&fb.auth&&fb.auth.currentUser&&S.profile&&!S.guest);
 const ago=t=>{const s=Math.max(0,(Date.now()-t)/1e3);return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
 const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}};
 let items=[],lastPost=0;
 b.innerHTML=`<div class="pad"><h2 style="margin-bottom:4px">Link sharing</h2><p class="muted" style="margin-bottom:12px">Share a link with everyone. No spam or unsafe sites.</p>
  ${ready()?`<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px"><input class="inp" id="lu" maxlength="500" placeholder="Paste a link (https://…)"><input class="inp" id="lt" maxlength="80" placeholder="Title (optional)"><div style="display:flex;gap:8px"><button class="btn" id="lp">Share link</button><button class="btn ghost" id="lr">Refresh</button></div></div>`
  :`<p class="muted" style="margin-bottom:12px">Sign in with an account to share links.</p><button class="btn ghost sm" id="lr" style="margin-bottom:12px">Refresh</button>`}
  <div id="ll" class="links"></div></div>`;
 const ll=$('#ll',b);
 function paintList(){
  const me=S.user&&S.user.uid;
  ll.innerHTML=items.map(x=>{
   const u=safeUrl(x.url);if(!u)return'';
   const ms=x.ts&&x.ts.toMillis?x.ts.toMillis():Date.now();
   return `<div style="border:1px solid #222;border-radius:10px;background:#101010;padding:10px 12px"><a class="lnk" style="border:0;background:none;padding:0" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><span><b>${esc(x.title||host(u))}</b><br><span class="muted" style="font-size:12px">${esc(host(u))}</span></span><i>↗</i></a><div class="muted" style="font-size:11px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${esc(x.name||'someone')} · ${ago(ms)}</span>${(me&&x.by===me)||myRank()>=2?`<button class="btn ghost sm" data-del="${esc(x.id)}">Delete</button>`:''}</div></div>`}).join('')||'<p class="muted">No links yet. Be the first to share one!</p>'}
 async function load(){
  if(!fb||!fb.auth||!fb.auth.currentUser){ll.innerHTML='<p class="muted">Sign in to see shared links.</p>';return}
  ll.innerHTML='<p class="muted">Loading…</p>';
  try{
   const s=await fb.getDocs(fb.query(C('links'),fb.orderBy('ts','desc'),fb.limit(50)));
   items=[];s.forEach(d=>items.push({id:d.id,...d.data()}));paintList()}
  catch(e){console.error(e);ll.innerHTML='<p class="muted">Could not load links. If this is brand new, the owner needs to publish the latest Firestore rules.</p>'}
 }
 $('#lr',b).onclick=load;
 const lp=$('#lp',b);
 if(lp)lp.onclick=async()=>{
  if(Date.now()-lastPost<15000)return toast('Slow down. Wait a few seconds between links');
  if(S.profile&&!isOwnerU(S.profile)&&mutedNow(S.profile))return toast('You are muted right now');
  const raw=$('#lu',b).value.trim();if(!raw)return toast('Paste a link first');
  const url=safeUrl(normUrl(raw));if(!url||url.length>500)return toast('That does not look like a valid link');
  const title=$('#lt',b).value.trim().slice(0,80);
  lp.disabled=true;
  try{
   await fb.setDoc(D('links',rndId()),{url,title,by:S.user.uid,name:S.profile.username,ts:fb.serverTimestamp()});
   lastPost=Date.now();$('#lu',b).value='';$('#lt',b).value='';toast('Link shared');load()}
  catch(e){console.error(e);toast('Could not share: '+(e.code||e.message))}
  lp.disabled=false};
 ll.onclick=async e=>{
  const n=e.target.closest('[data-del]');if(!n)return;
  try{await fb.deleteDoc(D('links',n.dataset.del));items=items.filter(x=>x.id!==n.dataset.del);paintList();toast('Deleted')}
  catch(err){console.error(err);toast('Could not delete')}};
 load();
}
