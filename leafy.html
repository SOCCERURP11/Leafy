<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leafy's Space</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='24' height='24' rx='6' fill='%23000' stroke='none'/%3E%3Cpath d='M6 18C6 10 11 6 18 6c0 7-4 12-12 12zM6 18l7-7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@400;600&family=Fira+Code:wght@400;600&family=Lora:wght@400;600&family=Nunito:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--accent:#243b9e;--bg:#000;--dfg:#fff;--glass:rgba(0,0,0,.45);--font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--cc:#fff;--cs:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;width:100%;background:var(--bg);color:var(--dfg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
svg{display:block}
#bgimg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0}
#rain{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}

/* buttons / inputs (apps are black & white) */
.btn{background:#fff;color:#000;border-radius:8px;padding:8px 14px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#141414;color:#fff;border:1px solid #333}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:#1a0000;color:#ff5c5c;border:1px solid #5a1010}
.inp{background:#111;border:1px solid #2c2c2c;border-radius:8px;padding:9px 11px;width:100%;outline:none;color:#fff}
.inp:focus{border-color:#fff}
textarea.inp{resize:none}
select.inp{appearance:none}
.muted{color:#888}
h2{font-size:16px;font-weight:600}

/* login */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.lcard{width:min(380px,100%);background:rgba(0,0,0,.72);backdrop-filter:blur(18px);border:1px solid #222;border-radius:18px;padding:26px;color:#fff}
.lcard h1{font-size:26px;font-weight:600;text-align:center;letter-spacing:-.5px}
.lcard .tag1{text-align:center;color:#8a8a8a;font-size:12px;margin:6px 0 18px}
.tabs{display:flex;background:#111;border-radius:10px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;padding:7px;border-radius:8px;color:#888;font-weight:600}
.tabs button.on{background:#fff;color:#000}
.lcard label{display:block;font-size:12px;color:#999;margin:10px 0 4px}
.lcard .btn{width:100%;margin-top:14px;padding:10px}
.err{color:#ff6b6b;font-size:12px;min-height:16px;margin-top:8px;text-align:center}
.warn{background:#1b1400;border:1px solid #4a3a00;color:#ffd166;font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:12px}
.hint{font-size:11px;color:#666;margin-top:4px}

/* desktop */
#desktop{position:fixed;inset:0;z-index:2;pointer-events:none}
#hero{position:absolute;inset:30px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px 60px;color:var(--dfg)}
#hero h1{font-size:clamp(34px,7vw,72px);font-weight:600;letter-spacing:-2px}
#hero p{opacity:.55;margin-top:8px;font-size:clamp(12px,2vw,15px)}
#menubar{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--glass);backdrop-filter:blur(20px);color:var(--dfg);pointer-events:auto;font-size:13px;z-index:400}
#menubar .l,#menubar .r{display:flex;align-items:center;gap:12px}
#menubar b{font-weight:600;display:flex;align-items:center;gap:6px}
#menubar svg{width:15px;height:15px}
#appname{opacity:.7}
.mbtn{padding:3px 9px;border-radius:6px;font-weight:500}
.mbtn:hover{background:rgba(128,128,128,.25)}
#panic{background:#e11d1d;color:#fff;font-weight:700;border-radius:6px;padding:3px 10px;font-size:12px;letter-spacing:.4px;box-shadow:0 0 12px #e11d1d66}
#panic:hover{background:#ff2b2b}
#windows{position:absolute;inset:30px 0 92px 0;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;background:#0a0a0a;color:#fff;border:1px solid #2a2a2a;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden;resize:both;min-width:300px;min-height:200px;pointer-events:auto;font-family:var(--font)}
.win.maxed{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;resize:none}
.win.mini{display:none}
.tb{height:36px;flex:none;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 12px;position:relative;touch-action:none;user-select:none}
.tl{display:flex;gap:8px;z-index:2}
.tl button{width:13px;height:13px;border-radius:50%;position:relative}
.tl .close{background:#ff5f57}.tl .min{background:#febc2e}.tl .max{background:#28c840}
.tl button::after{content:"";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#0008;line-height:13px;text-align:center}
.tl:hover .close::after{content:"×"}.tl:hover .min::after{content:"–"}.tl:hover .max::after{content:"+"}
.ttl{position:absolute;left:0;right:0;text-align:center;font-size:12px;color:#aaa;pointer-events:none}
.wbody{flex:1;min-height:0;position:relative;container-type:inline-size;overflow:hidden}

#bottom{position:absolute;left:0;right:0;bottom:0;padding:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#bl{display:flex;align-items:center;gap:8px;pointer-events:auto;flex:1}
#bspace{flex:1}
#aiOrb{width:44px;height:44px;border-radius:50%;background:#000;border:1px solid #333;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px var(--accent);transition:.2s}
#aiOrb:hover{transform:scale(1.08)}
#aiOrb svg{width:22px;height:22px}
#status{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px;background:var(--glass);backdrop-filter:blur(20px);color:var(--dfg);font-size:12px;white-space:nowrap}
#status .sep{width:1px;height:14px;background:currentColor;opacity:.25}
#dock{display:flex;gap:8px;padding:8px;border-radius:20px;background:var(--glass);backdrop-filter:blur(20px);pointer-events:auto;max-width:100%;overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.dk{width:44px;height:44px;flex:none;border-radius:12px;background:#0b0b0b;border:1px solid #2a2a2a;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;transition:.15s}
.dk:hover{transform:translateY(-4px) scale(1.08)}
.dk svg{width:21px;height:21px}
.dk.open::after{content:"";position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--dfg)}
.dk.min{opacity:.6}
@media(max-width:820px){
 #bottom{flex-direction:column-reverse;align-items:stretch;gap:8px}
 #bspace{display:none}
 #dock{align-self:center}
 #windows{inset:30px 0 112px 0}
 #status{flex:1;justify-content:center;min-width:0;font-size:11px;gap:6px;padding:0 8px}
}
@media(min-width:821px){#bottom{display:grid;grid-template-columns:1fr auto 1fr}}

.ovl{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:14px}
.card{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:16px;padding:20px;width:min(420px,100%);max-height:92vh;overflow:auto;color:#fff;font-family:var(--font)}
.card.wide{width:min(640px,100%)}
.toast{position:fixed;top:44px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:99px;font-weight:600;z-index:700;font-size:13px;box-shadow:0 8px 30px #0008}

/* settings / owner layout */
.set{display:flex;height:100%}
.set nav{width:150px;flex:none;border-right:1px solid #222;padding:10px;display:flex;flex-direction:column;gap:4px}
.set nav button{text-align:left;padding:8px 10px;border-radius:8px;color:#999;white-space:nowrap}
.set nav button.on{background:#fff;color:#000;font-weight:600}
.set section{flex:1;min-width:0;padding:16px;overflow:auto}
@container (max-width:520px){.set{flex-direction:column}.set nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid #222}}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #1a1a1a}
.row.col{flex-direction:column;align-items:flex-start}
.row label{font-weight:600}
.sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #333}
.sw:hover{border-color:#fff}
.cpick{width:34px;height:28px;border:0;background:none;padding:0}
input[type=range]{accent-color:#fff;width:150px}
.switch{appearance:none;width:42px;height:24px;border-radius:99px;background:#333;position:relative;cursor:pointer;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch:checked{background:#fff}.switch:checked::after{left:21px;background:#000}
.tblwrap{overflow:auto;border:1px solid #222;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #1a1a1a;white-space:nowrap}
th{color:#888;font-weight:600;position:sticky;top:0;background:#0a0a0a}

/* AI */
.ai{display:flex;flex-direction:column;height:100%}
.aimsgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:85%;padding:9px 12px;border-radius:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:#161616;border:1px solid #262626;border-bottom-left-radius:4px}
.aiform{display:flex;gap:8px;padding:10px;border-top:1px solid #222}

/* misc apps */
.pad{padding:16px;height:100%;overflow:auto}
.notes{width:100%;height:100%;background:#0a0a0a;border:0;outline:none;padding:16px;resize:none;line-height:1.6}
.calc{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px}
.cd{background:#111;border-radius:12px;padding:12px 14px;text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cd small{color:#777;min-height:16px;word-break:break-all}
.cv{font-size:30px;font-weight:600;word-break:break-all}
.ck{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck button{background:#151515;border:1px solid #262626;border-radius:12px;font-size:18px;font-weight:600}
.ck button:hover{background:#222}.ck button.op{background:#fff;color:#000}
.hv{display:flex;flex-direction:column;height:100%;gap:10px;padding:12px}
.hv textarea{flex:1;font-family:"Fira Code",ui-monospace,monospace;font-size:12px}
.hv iframe{flex:1;border:1px solid #222;border-radius:8px;background:#fff;display:none}
.upd{border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:12px}
.upd h3{font-size:14px}.upd small{color:#777}
.upd ul{margin:8px 0 0 18px;line-height:1.6;color:#ddd}
.cred{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-height:100%;line-height:1.5}
.cred h1{font-size:28px}.cred b{display:block;color:#888;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.cred small{color:#777;max-width:340px}

/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #222;flex:none}
.rooms,.ch-actions{display:flex;gap:6px}
.rooms button,.ch-actions button{padding:6px 11px;border-radius:8px;background:#141414;border:1px solid #2a2a2a;font-size:12px;font-weight:600}
.rooms button.on{background:#fff;color:#000}
.narrowonly{display:none}
.ch-main{flex:1;min-height:0;display:flex;position:relative}
.ch-col{flex:1;min-width:0;display:flex;flex-direction:column}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;padding:4px 6px;border-radius:10px}
.msg.me{background:#161616;box-shadow:inset 3px 0 0 #fff}
.msg .mh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.msg .nm{font-weight:600;cursor:pointer}
.msg .tm{color:#666;font-size:11px}
.msg .tx{word-break:break-word;line-height:1.45}
.men{background:#222;border-radius:5px;padding:0 4px}.men.me{background:#fff;color:#000;font-weight:600}
.composer{position:relative;display:flex;gap:8px;padding:10px;border-top:1px solid #222;flex:none}
.mention{position:absolute;left:10px;right:10px;bottom:100%;background:#0f0f0f;border:1px solid #2c2c2c;border-radius:10px;max-height:220px;overflow:auto;z-index:10;padding:4px}
.mention h5{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#777;padding:6px 8px 2px}
.mention button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px;text-align:left}
.mention button:hover,.mention button.hl{background:#222}
.ulist{width:190px;flex:none;border-left:1px solid #222;overflow:auto;padding:8px;background:#0a0a0a}
.ulist h4{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#777;margin:8px 6px 4px}
.urow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;width:100%;text-align:left}
.urow:hover{background:#181818}
.urow .un{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.urow.off{opacity:.45}
.dot{width:7px;height:7px;border-radius:50%;background:#28c840;flex:none}.off .dot{background:#555}
@container (max-width:620px){.ulist{position:absolute;right:0;top:0;bottom:0;z-index:6;display:none;box-shadow:-10px 0 30px #000}.ulist.show{display:block}.narrowonly{display:inline-flex}}
.av{border-radius:50%;background:#1a1a1a;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;margin:3px}
.av img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;background:#000;border:1px solid #333;color:#fff;font-weight:700;letter-spacing:.3px}
.tag.holy{animation:pw 1.8s ease-in-out infinite;border-color:#fff}
.tag.blood{color:#ff2a2a;border-color:#6b0000;animation:pr 1.6s ease-in-out infinite}
.tag.legend{border-color:#fff;letter-spacing:1.5px;box-shadow:0 0 8px #fff5}
@keyframes pw{0%,100%{box-shadow:0 0 0 0 #fff0}50%{box-shadow:0 0 12px 2px #fffb}}
@keyframes pr{0%,100%{box-shadow:0 0 0 0 #ff2a2a00}50%{box-shadow:0 0 12px 2px #ff2a2a99}}
.crates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.crate{border:1px solid #2a2a2a;border-radius:14px;padding:16px;text-align:center}
.crate .big{font-size:38px}
.inv{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.invi{padding:6px;border-radius:10px;border:1px solid #2a2a2a;background:#111;display:flex;align-items:center;gap:6px}
.invi.eq{border-color:#fff}
.shake{animation:sh .5s infinite}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.pop{animation:pp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pp{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* update part 1 */
.banner{margin:0 10px 6px;background:#2a0000;border:1px solid #5a1010;color:#ff7b7b;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;flex:none}
.emopop{position:absolute;left:10px;bottom:100%;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#0f0f0f;border:1px solid #2c2c2c;border-radius:10px;padding:6px;z-index:11}
.emopop button{font-size:20px;padding:4px;border-radius:6px;line-height:1}
.emopop button:hover{background:#222}
.composer .btn.ghost{padding:8px 10px}
.mimg{display:block;max-width:min(320px,100%);max-height:260px;border-radius:10px;margin-top:6px;cursor:zoom-in;border:1px solid #2a2a2a}
.reacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rbtn{padding:3px 8px;border-radius:99px;background:#141414;border:1px solid #2a2a2a;font-size:12px}
.rbtn:hover{border-color:#777}
.rbtn.on{background:#fff;color:#000;border-color:#fff}
.tag.role{border-color:#fff;letter-spacing:1px}
.links{display:flex;flex-direction:column;gap:6px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid #222;border-radius:10px;background:#101010;color:#fff;text-decoration:none;word-break:break-all}
.lnk:hover{border-color:#fff;background:#181818}
.lnk i{font-style:normal;color:#888;flex:none}

/* update part 2 */
.bal{font-weight:700;padding:6px 10px;border-radius:8px;background:#141414;border:1px solid #2a2a2a;font-size:12px;white-space:nowrap}
.fx-ice{color:#7dd3fc;text-shadow:0 0 8px #38bdf8aa}
.fx-fire{color:#ff4d2e;text-shadow:0 0 8px #ff4d2eaa}
.fx-earth{background:linear-gradient(90deg,#4ade80,#a16207);-webkit-background-clip:text;background-clip:text;color:transparent}
.fx-jolly{background:linear-gradient(90deg,#ef4444,#22c55e,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent}
.fx-hellfire{background:linear-gradient(90deg,#111,#ff1a1a,#111);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.6px #ff2a2a}
.tag.holly{background:#000;border-color:#333}
.tag.holly b{background:linear-gradient(90deg,#ff3b30,#34c759);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.tag.acid{background:#22c55e;color:#7e22ce;border-color:#16a34a}
.wheelbox{position:relative;width:260px;height:260px;margin:14px auto}
.wheelbox canvas{width:260px;height:260px;border-radius:50%;box-shadow:0 0 30px #0008;display:block}
.wheelbox .ptr{position:absolute;top:-10px;left:50%;margin-left:-10px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:20px solid #fff;z-index:2}
.odds{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 12px}
.odds span{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid #2a2a2a;color:#bbb}

/* cursor */
#cdot,#cring{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;display:none}
#cdot{width:calc(var(--cs)/2);height:calc(var(--cs)/2);margin:calc(var(--cs)/-4) 0 0 calc(var(--cs)/-4);background:var(--cc);border-radius:50%}
#cring{width:var(--cs);height:var(--cs);margin:calc(var(--cs)/-2) 0 0 calc(var(--cs)/-2);border:2px solid var(--cc);border-radius:50%}
body[data-cur="cross"] #cdot{width:var(--cs);height:var(--cs);margin:calc(var(--cs)/-2) 0 0 calc(var(--cs)/-2);background:none;border-radius:0}
body[data-cur="cross"] #cdot::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--cc)}
body[data-cur="cross"] #cdot::after{content:"";position:absolute;top:50%;left:0;right:0;height:2px;margin-top:-1px;background:var(--cc)}
@media(pointer:fine){
 body:not([data-cur="system"]) *{cursor:none!important}
 body[data-cur="dot"] #cdot,body[data-cur="both"] #cdot,body[data-cur="cross"] #cdot{display:block}
 body[data-cur="ring"] #cring,body[data-cur="both"] #cring{display:block}
}
</style>
</head>
<body data-cur="system">
<div id="bgimg"></div>
<canvas id="rain"></canvas>

<!-- LOGIN -->
<div id="login" hidden>
 <div class="lcard">
  <h1>Leafy's Space</h1>
  <div class="tag1">Nice, sleek OS, that is inspired by ICH and VUS.</div>
  <div class="tabs"><button data-m="login" class="on">Log in</button><button data-m="signup">Sign up</button></div>

class Custom extends Error{}
function authMsg(e){
 if(e instanceof Custom)return e.message;
 const c=e.code||'';
 if(c.includes('email-already-in-use'))return 'That username is taken.';
 if(['invalid-credential','user-not-found','wrong-password','invalid-login'].some(x=>c.includes(x)))return 'Wrong username or password.';
 if(c.includes('operation-not-allowed'))return 'Email/Password sign-in is not enabled in Firebase.';
 if(c.includes('too-many'))return 'Too many tries. Wait a bit.';
 if(c.includes('network'))return 'Network error.';
 return 'Something went wrong. ('+(c||e.message)+')';
}
async function getIP(){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),3500);const r=await fetch('https://api.ipify.org?format=json',{signal:c.signal});clearTimeout(t);return (await r.json()).ip||''}catch{return ''}}

 if(ip){const t=await fb.getDoc(D('ipBans',ip.replace(/[.:]/g,'_')));if(t.exists())throw new Custom('This network has been banned.')}
 return ip}
async function signup(name,pw,email){
 const ip=await checkBanned();
 const cred=await fb.createUserWithEmailAndPassword(fb.auth,toEmail(name),toPw(pw));
 const uid=cred.user.uid,lower=name.toLowerCase(),reserved={leafy:1,soccer:2,divinity:3};
 let id=reserved[lower]||rid(),tries=0;
 for(;;){
  const b=fb.writeBatch(fb.db);
  b.set(D('ids',String(id)),{uid,name:lower});
  b.set(D('users',uid),{username:name,id,bio:'',pfp:'',font:'system',ring:'',tag:'',rings:[],tags:[],vip:false,banned:false,lastSeen:Date.now(),created:Date.now(),lastRingCrate:0,lastTagCrate:0,role:'',mutedUntil:0,spamUntil:0,leaves:100,ringCrates:0,tagCrates:0});
  b.set(D('private',uid),{email:email||'',devices:[DEV],ips:ip?[ip]:[]});
  try{await b.commit();break}catch(e){if(++tries>6){try{await cred.user.delete()}catch{}throw e}id=rid()}

}

 if(!fb){err('Connecting…');$('#lgo').disabled=true;await initFB();$('#lgo').disabled=false;if(fb)fb.onAuthStateChanged(fb.auth,u=>{if(!S.busy)onUser(u)});else return err("Can't reach Firebase ("+fbErr+"). Your network may be blocking Firebase's script hosts.")}

async function onUser(u){
 if(!u){if(!S.entered)showLogin();return}
 if(u.isAnonymous){
  if(sessionStorage.leafy_guest){S.guest=true;if(!S.entered)enter()}else{await fb.signOut(fb.auth);showLogin()}
  return}
 try{
  const snap=await fb.getDoc(D('users',u.uid));
  if(!snap.exists())throw new Custom('Profile not found. Please sign up again.');
  const p=snap.data();
  if(p.banned){await fb.signOut(fb.auth);showLogin('This account has been banned.');return}
  S.user=u;S.profile={...p,uid:u.uid};S.guest=false;
  try{S.isOwner=p.id<=3||(await fb.getDoc(D('owners',u.uid))).exists()}catch{S.isOwner=p.id<=3}
  fb.updateDoc(D('private',u.uid),{devices:fb.arrayUnion(DEV),...(S.ip?{ips:fb.arrayUnion(S.ip)}:{})}).catch(()=>{});
  enter();
 }catch(e){console.error(e);await fb.signOut(fb.auth).catch(()=>{});showLogin(authMsg(e))}
}

 const app=APPS[id];if(!app)return;
 let w=wins[id];if(w){w.el.classList.remove('mini');focusWin(id);refreshDock();return}

 const W=Math.min(app.w||640,aw-16),H=Math.min(app.h||460,ah-16);

 el.style.left=Math.max(8,Math.min(aw-W-8,(aw-W)/2+((nWin%6)-3)*26))+'px';

 if(aw<720)el.classList.add('maxed');
 area.append(el);
 const cleanup=app.render($('.wbody',el),{id})||(()=>{});
 w=wins[id]={el,cleanup};
 const tb=$('.tb',el);
 $('.close',el).onclick=()=>closeWin(id);

 const toggleMax=()=>el.classList.toggle('maxed');

  const r=el.getBoundingClientRect(),a=area.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;tb.setPointerCapture(e.pointerId);
  const mv=ev=>{el.style.left=Math.max(-r.width+90,Math.min(a.width-90,ev.clientX-ox-a.left))+'px';el.style.top=Math.max(0,Math.min(a.height-36,ev.clientY-oy-a.top))+'px'};
  const up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up)};
  tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up)});

}

/* ================= MATH / AI ================= */
function evalMath(src){
 let s=src.toLowerCase().replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\bplus\b/g,'+').replace(/\bminus\b/g,'-').replace(/\b(times|multiplied by)\b/g,'*').replace(/\b(divided by|over)\b/g,'/').replace(/\bto the power of\b/g,'^').replace(/\*\*/g,'^').replace(/\bsquared\b/g,'^2').replace(/\bcubed\b/g,'^3').replace(/\bmod\b/g,'%').replace(/(\d)\s*x\s*(\d)/g,'$1*$2');
 const tk=s.match(/\d*\.?\d+|[a-z]+|[-+*/^%(),]/g)||[];let i=0;
 const peek=()=>tk[i],nx=()=>tk[i++];
 const rad=x=>x*Math.PI/180;
 const F={sqrt:Math.sqrt,abs:Math.abs,sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),log:Math.log10,ln:Math.log,round:Math.round,floor:Math.floor,ceil:Math.ceil};
 const group=()=>{const v=expr();if(nx()!==')')throw 0;return v};
 const prim=()=>{const t=nx();if(t==null)throw 0;
  if(/^[\d.]/.test(t))return parseFloat(t);
  if(t==='(')return group();
  if(t==='-')return -pw();if(t==='+')return pw();
  if(t==='pi')return Math.PI;if(t==='e')return Math.E;
  if(F[t]){const a=peek()==='('?(nx(),group()):pw();return F[t](a)}
  throw 0};
 const pw=()=>{const b=prim();if(peek()==='^'){nx();return Math.pow(b,pw())}return b};
 const term=()=>{let v=pw();while(['*','/','%'].includes(peek())){const o=nx(),r=pw();v=o==='*'?v*r:o==='/'?v/r:v%r}return v};
 const expr=()=>{let v=term();while(peek()==='+'||peek()==='-'){const o=nx(),r=term();v=o==='+'?v+r:v-r}return v};
 const v=expr();if(i<tk.length||!isFinite(v))throw 0;return Math.round(v*1e10)/1e10;
}
const ALIAS={meters:'m',meter:'m',m:'m',km:'km',kilometers:'km',kilometer:'km',cm:'cm',mm:'mm',mi:'mi',mile:'mi',miles:'mi',ft:'ft',feet:'ft',foot:'ft',in:'in',inch:'in',inches:'in',yd:'yd',yard:'yd',yards:'yd',kg:'kg',kilograms:'kg',kilogram:'kg',g:'g',grams:'g',gram:'g',lb:'lb',lbs:'lb',pounds:'lb',pound:'lb',oz:'oz',ounces:'oz',ounce:'oz',l:'l',liters:'l',liter:'l',ml:'ml',gal:'gal',gallon:'gal',gallons:'gal',c:'c',f:'f',k:'k',celsius:'c',fahrenheit:'f',kelvin:'k','°c':'c','°f':'f'};
const BASE={m:['len',1],km:['len',1000],cm:['len',.01],mm:['len',.001],mi:['len',1609.344],ft:['len',.3048],in:['len',.0254],yd:['len',.9144],kg:['mass',1],g:['mass',.001],lb:['mass',.45359237],oz:['mass',.028349523],l:['vol',1],ml:['vol',.001],gal:['vol',3.785411784]};
function convert(v,a,b){
 if(['c','f','k'].includes(a)&&['c','f','k'].includes(b)){let c=a==='c'?v:a==='f'?(v-32)*5/9:v-273.15;return b==='c'?c:b==='f'?c*9/5+32:c+273.15}
 const A=BASE[a],B=BASE[b];if(!A||!B||A[0]!==B[0])return null;return v*A[1]/B[1]}

async function wiki(q){
 let topic=q.replace(/^(who|what|where|when|why|how)\b('s|s)?\s*/i,'').replace(/^(is|are|was|were|does|do|did)\s+/i,'').replace(/^(a|an|the)\s+/i,'').replace(/^(define|explain|describe|tell me about|meaning of)\s+/i,'').trim()||q;
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),7000);
 try{
  const s=await fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(topic)+'&srlimit=1&format=json&origin=*',{signal:ctl.signal}).then(r=>r.json());
  const hit=s.query?.search?.[0];if(!hit)return null;
  const sum=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(hit.title.replace(/ /g,'_')),{signal:ctl.signal}).then(r=>r.json());
  return sum.extract?sum.extract+'\n\n(Wikipedia: '+sum.title+')':null;
 }catch{return null}finally{clearTimeout(to)}
}
async function answer(q){
 const t=q.toLowerCase().trim().replace(/[?!.]+$/,'');let m;
 if(/^(hi|hello|hey|yo|sup)\b/.test(t))return "Hey! Ask me math, conversions, facts, or how anything in Leafy's Space works.";
 if(/how are you/.test(t))return "Running fast and feeling good. What do you need?";
 if(/(who are you|your name|what are you)/.test(t))return "I'm Leafy AI, the built-in helper. I do instant math and conversions, look up facts, and explain the OS.";
 if(/^(thanks|thank you|ty)/.test(t))return "Anytime!";
 if(/\b(what|tell).*\btime\b/.test(t))return "It's "+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+".";
 if(/\b(what|tell).*\b(date|day)\b/.test(t)&&!/(rain|today's weather)/.test(t))return "Today is "+new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})+".";
 if(/joke/.test(t))return pick(JOKES);
 if(/(flip a coin|coin flip)/.test(t))return pick(['Heads.','Tails.']);
 if(/roll (a )?(die|dice|d6)/.test(t))return 'You rolled a '+(1+Math.floor(Math.random()*6))+'.';
 if(m=t.match(/random number (?:between )?(-?\d+) (?:and|to) (-?\d+)/)){const a=+m[1],b=+m[2];return String(Math.min(a,b)+Math.floor(Math.random()*(Math.abs(b-a)+1)))}
 if(/\b(how|where|can i|change|set|turn|make|what is the)\b/.test(t)){const h=HELP.find(h=>h.k.test(t));if(h)return h.a}
 if(m=t.match(/(-?\d+\.?\d*)\s*%\s*of\s*(-?\d+\.?\d*)/))return `${m[1]}% of ${m[2]} = ${Math.round(m[1]*m[2])/100}`;
 if(m=t.match(/(-?\d+\.?\d*)\s*([a-z°]+)\s+(?:to|in|into)\s+([a-z°]+)/)){const a=ALIAS[m[2]],b=ALIAS[m[3]];if(a&&b){const r=convert(+m[1],a,b);if(r!=null)return `${m[1]} ${m[2]} = ${Math.round(r*1e6)/1e6} ${m[3]}`}}
 if(/\d/.test(t)){const ex=t.replace(/^(what('s| is)|whats|calculate|compute|solve|evaluate|=)\s*/,'');try{return ex+' = '+evalMath(ex)}catch{}}
 const w=await wiki(q);
 return w||"I couldn't find that. Try rephrasing, or ask me something like 'what is photosynthesis', '15% of 80', or '10 km to miles'.";
}

/* ================= COSMETICS (wheel, crates, collection) + GIFTS ================= */
const COST={ring:40,tag:40,spin:50},DAILY_LEAVES=50;
const CRATE_TAGS=TAGS.filter(t=>!t.fx);
const WHEEL=[{id:'vip1',label:'VIP 1 day',w:10,c:'#ffffff',t:'#000'},{id:'vipf',label:'VIP forever',w:1,c:'#ffd166',t:'#000'},{id:'ice',label:'Ice',w:20,c:'#38bdf8',t:'#04202e'},{id:'fire',label:'Fire',w:20,c:'#ef4444',t:'#fff'},{id:'earth',label:'Earth',w:20,c:'#65a30d',t:'#fff'},{id:'jolly',label:'Jolly',w:15,c:'#15803d',t:'#fff'},{id:'hellfire',label:'Hellfire',w:14,c:'#450a0a',t:'#ff4d4d'}];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tagChip=x=>x.fx?`<span class="fx-${x.fx}">${esc(x.text)}</span>`:`<span class="tag ${x.cls||''}">${x.html||esc(x.text)}</span>`;
function drawWheel(cv){
 const c=cv.getContext('2d'),R=130;let a=-Math.PI/2;c.clearRect(0,0,260,260);
 for(const s of WHEEL){
  const ang=s.w/100*Math.PI*2;
  c.beginPath();c.moveTo(R,R);c.arc(R,R,R-4,a,a+ang);c.closePath();c.fillStyle=s.c;c.fill();c.strokeStyle='#000';c.lineWidth=2;c.stroke();
  if(s.w>=10){c.save();c.translate(R,R);c.rotate(a+ang/2);c.fillStyle=s.t||'#fff';c.font='bold 13px sans-serif';c.textAlign='right';c.fillText(s.label,R-18,5);c.restore()}
  a+=ang}
 c.beginPath();c.arc(R,R,14,0,Math.PI*2);c.fillStyle='#000';c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke()}
function cosmeticsModal(){
 const m=modal('',true);
 let tab='wheel',busy=false,rot=0,result='';
 const P=()=>S.profile,lv=()=>P().leaves??0,free=()=>Date.now()-(P().lastWheel||0)>=DAY,daily=()=>Date.now()-(P().lastDaily||0)>=DAY;
 const left=t=>Math.max(1,Math.ceil((t+DAY-Date.now())/36e5))+'h';
 const save=async d=>{try{await fb.updateDoc(D('users',S.user.uid),d);return true}catch(e){console.error(e);toast('Failed: '+(e.code||e.message));return false}};
 const invHTML=(list,key,cur)=>{const owned=(P()[key]||[]).map(id=>list.find(x=>x.id===id)).filter(Boolean);return `<div class="inv">${owned.map(x=>`<button class="invi${cur===x.id?' eq':''}" data-k="${key}" data-id="${x.id}">${key==='rings'?avHTML({username:'?',ring:x.id},22)+'<small>'+esc(x.name)+'</small>':tagChip(x)}</button>`).join('')||'<span class="muted">Nothing yet.</span>'}</div>`};
 const paint=()=>{
  const p=P();let body='';
  if(tab==='wheel'){
   body=`<div class="wheelbox"><div class="ptr"></div><canvas id="wh" width="260" height="260"></canvas></div><div class="odds">${WHEEL.map(s=>`<span>${s.label} ${s.w}%</span>`).join('')}</div><div style="text-align:center"><button class="btn" id="spin">${free()?'Free spin':'Spin · '+COST.spin+' 🍃'}</button></div><div style="text-align:center;margin-top:12px;min-height:50px">${result}</div>`}
  else if(tab==='crates'){
   body=`<div class="crates">${[['ring','📦','Ring Crate','Rainbow rings. Legendary: White &amp; Black','ringCrates'],['tag','🏷️','Tag Crate','Legendary: Holy Angel &amp; Bloodlust. Epic: Hollity Jollity &amp; Acid','tagCrates']].map(([k,e,n,d,ck])=>`<div class="crate"><div class="big" id="big-${k}">${e}</div><b>${n}</b><p class="muted" style="margin:4px 0 10px;font-size:12px">${d}</p><button class="btn" data-open="${k}">${(p[ck]||0)>0?'Open (gifted ×'+p[ck]+')':'Open · '+COST[k]+' 🍃'}</button></div>`).join('')}</div><div style="text-align:center;min-height:70px">${result}</div>`}
  else{
   body=`<h2>Rings</h2>${invHTML(RINGS,'rings',p.ring)}<h2>Tags</h2>${invHTML(TAGS,'tags',p.tag)}<button class="btn ghost sm" data-unequip="1">Unequip all</button>`}
  m.el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Cosmetics</h2><span class="bal">🍃 ${lv()}</span></div><div class="tabs" style="margin-top:10px">${[['wheel','Wheel'],['crates','Crates'],['inv','Collection']].map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}</div><div class="row" style="padding-top:0"><span class="muted">Daily Leaves</span><button class="btn sm" data-daily="1" ${daily()?'':'disabled'}>${daily()?'Claim +'+DAILY_LEAVES+' 🍃':'Next in '+left(p.lastDaily||0)}</button></div>${body}`;
  const cv=$('#wh',m.el);if(cv){drawWheel(cv);cv.style.transform=`rotate(${rot}deg)`}};
 async function openCrate(kind){
  busy=true;
  const key=kind==='ring'?'rings':'tags',ck=kind==='ring'?'ringCrates':'tagCrates',list=kind==='ring'?RINGS:CRATE_TAGS,have=P()[ck]||0,d={};
  if(have>0)d[ck]=have-1;
  else if(lv()>=COST[kind])d.leaves=lv()-COST[kind];
  else{busy=false;return toast('Not enough Leaves 🍃')}
  const item=roll(list),dupe=(P()[key]||[]).includes(item.id);
  d[key]=fb.arrayUnion(item.id);
  const big=$('#big-'+kind,m.el);if(big)big.classList.add('shake');
  const ok=await save(d);
  await sleep(900);busy=false;
  if(!ok)return paint();
  result=`<div class="pop"><p class="muted">${esc(item.rar)}${dupe?' · duplicate':''}</p><div style="margin:8px 0">${kind==='ring'?avHTML({username:S.profile.username,ring:item.id,pfp:S.profile.pfp},64):tagChip(item)}</div>${kind==='ring'?'<b>'+esc(item.name)+' ring</b>':''}</div>`;
  paint()}
 async function spin(){
  const isFree=free();
  if(!isFree&&lv()<COST.spin)return toast('Not enough Leaves 🍃');
  busy=true;
  const s=roll(WHEEL),d={};let note='';
  if(isFree)d.lastWheel=Date.now();else d.leaves=lv()-COST.spin;
  if(s.id==='vip1'){d.vipUntil=Date.now()+DAY;note='VIP for 1 day 💎'}
  else if(s.id==='vipf'){d.vipForever=true;note='VIP FOREVER 💎'}
  else{d.tags=fb.arrayUnion(s.id);note=(P().tags||[]).includes(s.id)?'Duplicate':'New tag'}
  const ok=await save(d);
  if(!ok){busy=false;return}
  let before=0;for(const x of WHEEL){if(x===s)break;before+=x.w}
  const phi=(before+s.w/2)/100*360+(Math.random()-.5)*(s.w/100*360*.7);
  rot=Math.ceil(rot/360)*360+360*5+(360-phi);
  const cv=$('#wh',m.el);cv.style.transition='transform 4s cubic-bezier(.12,.7,.1,1)';cv.style.transform=`rotate(${rot}deg)`;
  await sleep(4200);busy=false;
  const t=TAGS.find(x=>x.id===s.id);
  result=`<div class="pop"><p class="muted">You won</p><b style="font-size:16px">${t?tagChip(t)+' <span class="muted" style="font-size:12px">'+(note==='Duplicate'?'(duplicate)':'· equip it in Collection')+'</span>':esc(note)}</b></div>`;
  paint()}
 m.el.onclick=async e=>{
  if(busy)return;
  const t=e.target.closest('[data-tab]'),o=e.target.closest('[data-open]'),q=e.target.closest('.invi'),u=e.target.closest('[data-unequip]'),d=e.target.closest('[data-daily]'),s=e.target.closest('#spin');
  if(t){tab=t.dataset.tab;result='';return paint()}
  if(d){if(!daily())return;if(await save({leaves:lv()+DAILY_LEAVES,lastDaily:Date.now()}))toast('+'+DAILY_LEAVES+' Leaves 🍃');return paint()}
  if(u){await save({ring:'',tag:''});return paint()}
  if(q){await save({[q.dataset.k==='rings'?'ring':'tag']:q.dataset.id});return paint()}
  if(o)return openCrate(o.dataset.open);
  if(s)return spin()};
 paint();
}
function giftModal(u,done){
 const m=modal(`<h2>Gift ${esc(u.username)}</h2><p class="muted" style="margin:6px 0 10px">🍃 ${u.leaves??0} · ring crates ${u.ringCrates||0} · tag crates ${u.tagCrates||0}</p>${[['leaves','Leaves',100],['ring','ring crates',1],['tag','tag crates',1]].map(([k,n,v])=>`<div class="row"><input class="inp" id="g-${k}" type="number" min="1" max="100000" value="${v}" style="width:110px"><button class="btn sm" data-g="${k}">Give ${n}</button></div>`).join('')}<div class="row"><span>VIP forever</span><button class="btn ghost sm" data-g="vip">${u.vip?'Remove VIP':'Give VIP'}</button></div>`);
 m.el.onclick=async e=>{
  const bt=e.target.closest('[data-g]');if(!bt)return;
  const k=bt.dataset.g,inp=$('#g-'+k,m.el),n=Math.max(1,Math.min(100000,parseInt(inp?inp.value:'1',10)||1));
  const data=k==='leaves'?{leaves:fb.increment(n)}:k==='ring'?{ringCrates:fb.increment(n)}:k==='tag'?{tagCrates:fb.increment(n)}:{vip:!u.vip};
  try{await fb.updateDoc(D('users',u.uid),data);toast(k==='vip'?(u.vip?'VIP removed':'VIP given'):'Gifted '+n);m.close();if(done)done()}
  catch(err){console.error(err);toast('Failed: '+(err.code||err.message))}};
}

function banModal(r,pv,done){
 const m=modal(`<h2>${r.banned?'Unban':'Ban'} ${esc(r.username)}</h2>${r.banned?'<p class="muted" style="margin:8px 0">This removes the account ban and any device or IP bans saved for them.</p>':'<label style="display:flex;gap:8px;margin:12px 0 6px"><input type="checkbox" id="bd" checked> Ban their device(s)</label><label style="display:flex;gap:8px;margin:6px 0"><input type="checkbox" id="bi"> Also ban their IP address(es)</label><p class="hint">IP bans also block everyone else on the same Wi-Fi or network. Use sparingly. The site can only see IPs from people who logged in after this update.</p>'}<button class="btn ${r.banned?'':'danger'}" id="bgo" style="width:100%;margin-top:12px">${r.banned?'Unban':'Ban'}</button>`);
 $('#bgo',m.el).onclick=async()=>{
  try{
   const on=!r.banned,devs=pv.devices||[],ips=pv.ips||[],ipKey=ip=>ip.replace(/[.:]/g,'_'),bt=fb.writeBatch(fb.db);
   bt.update(D('users',r.uid),{banned:on});
   if(on){
    if($('#bd',m.el).checked)devs.forEach(dv=>bt.set(D('deviceBans',dv),{uid:r.uid,ts:Date.now()}));
    if($('#bi',m.el).checked)ips.forEach(ip=>bt.set(D('ipBans',ipKey(ip)),{uid:r.uid,ip,ts:Date.now()}));
   }else{devs.forEach(dv=>bt.delete(D('deviceBans',dv)));ips.forEach(ip=>bt.delete(D('ipBans',ipKey(ip))))}
   await bt.commit();toast(on?'Banned':'Unbanned');m.close();done()
  }catch(e){console.error(e);toast('Failed: '+(e.code||e.message))}};
}
async function ownerAccounts(sec){
 sec.innerHTML='<p class="muted">Loading…</p>';
 try{
  const [us,pr,ow]=await Promise.all([fb.getDocs(C('users')),fb.getDocs(C('private')),fb.getDocs(C('owners'))]);
  const priv={};pr.forEach(d=>priv[d.id]=d.data());const owners=new Set(ow.docs.map(d=>d.id));
  const rows=us.docs.map(d=>({uid:d.id,...d.data()})).sort((a,b)=>a.id-b.id);
  const top=r=>r.id<=3||owners.has(r.uid);
  const canAct=r=>r.uid!==S.user.uid&&(S.isOwner||r.id>3);
  sec.innerHTML=`<input class="inp" id="q" placeholder="Search username…" style="margin-bottom:10px"><div class="tblwrap"><table><thead><tr><th>ID</th><th>User</th><th>Role</th><th>Email</th><th>Last seen</th><th>Status</th><th></th></tr></thead><tbody></tbody></table></div><p class="hint" style="margin-top:8px">Passwords are never stored or viewable. Firebase keeps only a secure hash.</p>`;
  const draw=()=>{const q=$('#q',sec).value.toLowerCase();$('tbody',sec).innerHTML=rows.filter(r=>r.username.toLowerCase().includes(q)).map(r=>{
   const status=r.banned?'🚫 banned':mutedNow(r)?'🔇 muted':isVipU(r)?'💎 VIP':'ok';

   return `<tr><td>#${r.id}</td><td>${esc(r.username)}</td><td>${role}</td><td>${esc(priv[r.uid]?.email||'—')}</td><td>${r.lastSeen?new Date(r.lastSeen).toLocaleString():'—'}</td><td>${status}</td><td>${acts}</td></tr>`}).join('')};
  draw();$('#q',sec).oninput=draw;
  const find=el=>rows.find(r=>r.uid===el.dataset.u);
  sec.onclick=async e=>{const x=e.target.closest('button[data-a]');if(!x)return;const r=find(x);if(!r)return;
   try{
    if(x.dataset.a==='vip'){x.disabled=true;await fb.updateDoc(D('users',r.uid),{vip:!r.vip});ownerAccounts(sec)}
    else if(x.dataset.a==='gift')giftModal(r,()=>ownerAccounts(sec));
    else if(x.dataset.a==='mute')muteModal(r,()=>ownerAccounts(sec));
    else if(x.dataset.a==='ban')banModal(r,priv[r.uid]||{},()=>ownerAccounts(sec));
   }catch(err){console.error(err);toast('Failed: '+(err.code||err.message));x.disabled=false}};
  sec.onchange=async e=>{const x=e.target.closest('select[data-a="role"]');if(!x)return;const r=find(x);if(!r)return;
   try{await fb.updateDoc(D('users',r.uid),{role:x.value});toast('Role updated');ownerAccounts(sec)}catch(err){console.error(err);toast('Failed: '+(err.code||err.message))}};
 }catch(e){console.error(e);sec.innerHTML='<p class="muted">Could not load accounts ('+esc(e.code||e.message)+'). Make sure the newest Firestore rules are published and that you logged out and back in as an owner.</p>'}

function linkList(arr){

  try{const x=new URL(url),p=x.pathname.length>1?x.pathname:'';h=x.hostname.replace(/^www\./,'')+(p.length>30?p.slice(0,30)+'…':p)}catch{}
